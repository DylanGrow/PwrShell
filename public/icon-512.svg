<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="12"/>
  
  <!-- Terminal Prompt > -->
  <path d="M120 160 L240 256 L120 352" fill="none" stroke="url(#grad1)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cursor _ -->
  <line x1="280" y1="352" x2="380" y2="352" stroke="#00f0ff" stroke-width="36" stroke-linecap="round"/>

  <!-- Orbiting Satellite Ring -->
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="6" stroke-dasharray="16 12" transform="rotate(-25 256 256)"/>
  
  <!-- Little Star/Satellite -->
  <circle cx="410" cy="190" r="16" fill="#00f0ff"/>
</svg>
