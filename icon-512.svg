<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="psBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="psPrompt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="psGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="psBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="60%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#psBg)" stroke="url(#psBorder)" stroke-width="20" />
  
  <!-- Subtle Top Lighting -->
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#psGlow)" />

  <!-- Mini Header "PS" Pill Badge -->
  <rect x="74" y="76" width="116" height="52" rx="16" fill="#0078d4" fill-opacity="0.35" stroke="#38bdf8" stroke-width="5" />
  <text x="132" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PS</text>

  <!-- Window Dots -->
  <circle cx="410" cy="102" r="10" fill="#ff5f56" opacity="0.9" />
  <circle cx="376" cy="102" r="10" fill="#ffbd2e" opacity="0.9" />
  <circle cx="342" cy="102" r="10" fill="#27c93f" opacity="0.9" />

  <!-- PowerShell Chevron Prompt (>) -->
  <path d="M120 200 L248 304 L120 408" fill="none" stroke="url(#psPrompt)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Cursor (_) -->
  <line x1="284" y1="408" x2="400" y2="408" stroke="#00f0ff" stroke-width="48" stroke-linecap="round" filter="url(#neonGlow)" />
</svg>
